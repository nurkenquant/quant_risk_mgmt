<li class="tx">
  <a href="{{ url_for('edit_tx', tx_id=t.id) }}">
    <span class="tx-ico {{ t.kind }}{{ ' loan' if t.loan_id }}" aria-hidden="true">{{ (t.category or '?')[0] }}</span>
    <span class="tx-main">
      <b>{{ t.merchant or t.category }}</b>
      <small>{{ t.category }}{% if show_day %} · {{ t.day }}{% endif %}{% if t.note %} · {{ t.note }}{% endif %}</small>
    </span>
    {% if t.receipt %}<span class="clip" title="Receipt attached" aria-label="Receipt attached">
      <svg viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></span>{% endif %}
    <span class="amt {{ t.kind }}">{{ money(t.amount if t.kind == 'income' else -t.amount, True) }}</span>
  </a>
</li>
